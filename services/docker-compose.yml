services:
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ${PWD}/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # - ./mosquitto/data:/mosquitto/data
      - ${PWD}/mosquitto/mosquitto.log:/mosquitto/log/mosquitto.log
    ports:
      - 1883:1883

  hsmqttbridge:
    image: mqtt_bridge:latest
    container_name: mqtt_bridge
    env_file:
      - ./hsmqttbridge/.env
    depends_on: [ mosquitto ]
    restart: unless-stopped
    environment:
      HYDROSERVER_URL: ${HYDROSERVER_URL}
      WORKSPACE_API_KEY: ${WORKSPACE_API_KEY}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER}
      DB_PATH: ${DB_PATH}
      LOG_LEVEL: ${LOG_LEVEL}
      MAX_RETRY_ATTEMPT: ${MAX_RETRY_ATTEMPT}
      RETRY_INTERVAL: ${RETRY_INTERVAL}

    volumes:
      - ${PWD}/hsmqttbridge/data:/app/data

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    restart: unless-stopped
