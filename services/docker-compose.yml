services:
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ${PWD}/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # - ./mosquitto/data:/mosquitto/data
      - ${PWD}/mosquitto/mosquitto.log:/mosquitto/log/mosquitto.log
    ports:
      - 1883:1883
    environment:
      - TZ=America/Denver

  hsmqttbridge:
    image: sabinpanta/hsmqttbridge:latest
    container_name: hsmqttbridge
    env_file:
      - ./hsmqttbridge/.env
    depends_on: [ mosquitto ]
    restart: unless-stopped
    volumes:
      - ${PWD}/hsmqttbridge/data:/hsmqttbridge/data
      - ${PWD}/hsmqttbridge/.env:/hsmqttbridge/.env
    environment:
      - TZ=America/Denver
